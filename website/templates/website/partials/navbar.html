{% load static %}
<header class="navbar">
  <div class="container navbar-flex">

    <a href="{% url 'website:home' %}" class="logo">
      <i class="bi bi-hexagon-fill"></i> NexaN<span>Digital</span>
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="{% url 'website:home' %}">Home</a>

      <div class="dropdown">
        <a href="{% url 'website:services' %}" class="dropdown-toggle">
          Services <i class="bi bi-chevron-down"></i>
        </a>
        <div class="dropdown-menu">
          {% for service in nav_services %}
            <a href="{% url 'website:service_detail' service.slug %}">{{ service.title }}</a>
          {% endfor %}
        </div>
      </div>

      <a href="{% url 'website:portfolio' %}">Portfolio</a>
      <a href="{% url 'website:about' %}">About Us</a>
      <a href="{% url 'website:portfolio' %}">Blog</a>
      <a href="{% url 'website:contact' %}">Contact</a>
    </nav>

    <a href="{% url 'website:contact' %}" class="btn btn-primary nav-cta">Get a Quote</a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <i class="bi bi-list"></i>
    </button>

  </div>
</header>
